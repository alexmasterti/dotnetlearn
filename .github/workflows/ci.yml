name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  curriculum-smoke:
    name: Curriculum Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile every code/challenge solution against the .NET 9 runner
        run: npm run test:curriculum
        env:
          RUNNER_URL: https://runner-net9-production.up.railway.app

  deploy-ready:
    name: Deploy Ready
    needs: [build-and-lint, curriculum-smoke]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Confirm deployment
        run: |
          echo "All checks passed — Railway will auto-deploy this commit."
          echo "Commit: ${{ github.sha }}"
